<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Django App{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
        nav { background: #2c3e50; padding: 14px 24px; display: flex; align-items: center; gap: 20px; }
        nav a { color: #ecf0f1; text-decoration: none; font-size: 0.9rem; }
        nav a:hover { color: #3498db; }
        nav .brand { font-weight: bold; font-size: 1.1rem; color: #fff; margin-right: auto; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card { background: #fff; border-radius: 8px; padding: 28px 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        h1 { font-size: 1.6rem; margin-bottom: 20px; color: #2c3e50; }
        .btn { display: inline-block; padding: 9px 20px; border-radius: 5px; border: none; cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 600; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-secondary { background: #95a5a6; color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        th { background: #f8f9fa; font-weight: 600; color: #555; }
        .alert { padding: 10px 16px; border-radius: 5px; margin-bottom: 18px; font-size: 0.88rem; }
        .alert-error { background: #fdecea; color: #c0392b; border: 1px solid #f5c6cb; }
        .empty { text-align: center; color: #aaa; padding: 32px 0; }
        form label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.88rem; color: #555; }
        form input { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.9rem; margin-bottom: 14px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 0.78rem; font-weight: 600; }
        .badge-info { background: #d6eaf8; color: #1a6fa0; }
        .meta { font-size: 0.8rem; color: #999; margin-bottom: 20px; }
    </style>
</head>
<body>
<nav>
    <span class="brand">📚 Django App</span>
    <a href="/book_app/">All Books</a>
    <a href="/book_app/add/">Add Book</a>
    <a href="/book_app/expensive/">Price > 100</a>
    {% if user.is_authenticated %}
        <a href="/accounts/dashboard/">Dashboard</a>
        <a href="/accounts/logout/">Logout</a>
    {% else %}
        <a href="/accounts/login/">Login</a>
    {% endif %}
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
